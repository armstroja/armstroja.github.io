<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src cdn.jsdelivr.net;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>jaacck — 3D</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05040f;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    canvas { display: block; }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #title {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(180, 160, 255, 0.35);
    }

    #hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(150, 130, 220, 0.28);
      white-space: nowrap;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #05040f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease;
    }

    #loader.fade {
      opacity: 0;
      pointer-events: none;
    }

    .loader-text {
      font-size: 12px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(150, 130, 255, 0.5);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>

<div id="loader"><span class="loader-text">loading</span></div>

<div id="overlay">
  <div id="title">jaacck</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

/* ── Scene ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040f);
scene.fog = new THREE.FogExp2(0x05040f, 0.012);

/* ── Camera ── */
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0, 0.6, 8.5);

/* ── Controls ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.042;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.enablePan = false;

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0x1a1050, 2.0));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 10, 8);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4433ff, 1.2);
fill.position.set(-8, -4, 2);
scene.add(fill);

/* animated accent lights */
const bL = new THREE.PointLight(0x2244ff, 16, 24);
bL.position.set(-8, 3, 7);
scene.add(bL);

const mL = new THREE.PointLight(0xff1aaa, 14, 24);
mL.position.set(8, -3, 7);
scene.add(mL);

const cL = new THREE.PointLight(0x00ffcc, 8, 18);
cL.position.set(0, 8, -5);
scene.add(cL);

const wL = new THREE.PointLight(0xffffff, 4, 12);
wL.position.set(0, 0, 9);
scene.add(wL);

/* ── Stars ── */
const sGeo = new THREE.BufferGeometry();
const sN = 700;
const sP = new Float32Array(sN * 3);
for (let i = 0; i < sN; i++) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const r = 22 + Math.random() * 14;
  sP[i*3]   = r * Math.sin(ph) * Math.cos(th);
  sP[i*3+1] = r * Math.sin(ph) * Math.sin(th);
  sP[i*3+2] = r * Math.cos(ph);
}
sGeo.setAttribute('position', new THREE.BufferAttribute(sP, 3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({
  color: 0x8899ff, size: 0.06, sizeAttenuation: true,
  transparent: true, opacity: 0.55
})));

/* ── 3D Text ── */
const fontLoader = new FontLoader();
fontLoader.load(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  (font) => {
    /* main text */
    const geo = new TextGeometry('jaacck', {
      font,
      size: 1.1,
      height: 0.46,
      curveSegments: 20,
      bevelEnabled: true,
      bevelThickness: 0.065,
      bevelSize: 0.040,
      bevelSegments: 14,
    });

    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    geo.translate(
      -(bb.max.x + bb.min.x) / 2,
      -(bb.max.y + bb.min.y) / 2,
      -(bb.max.z + bb.min.z) / 2
    );

    /* primary material — polished chrome */
    const mat = new THREE.MeshPhongMaterial({
      color: 0xe8eeff,
      specular: 0xffffff,
      shininess: 380,
      emissive: 0x06051a,
    });

    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    /* edge wireframe overlay */
    const edgeGeo = new THREE.EdgesGeometry(geo, 12);
    const edgeMat = new THREE.LineBasicMaterial({
      color: 0x6677ff,
      transparent: true,
      opacity: 0.18,
    });
    mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

    /* reflection plane (glossy floor) */
    const planeGeo = new THREE.PlaneGeometry(30, 30);
    const planeMat = new THREE.MeshPhongMaterial({
      color: 0x060520,
      specular: 0x3333aa,
      shininess: 80,
      transparent: true,
      opacity: 0.6,
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -1.3;
    scene.add(plane);

    /* fade out loader */
    setTimeout(() => {
      document.getElementById('loader').classList.add('fade');
      setTimeout(() => document.getElementById('loader').remove(), 900);
    }, 300);
  }
);

/* ── Resize ── */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ── Animate ── */
const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  /* orbit the accent lights */
  bL.position.x = Math.cos(t * 0.36) * 9;
  bL.position.y = Math.sin(t * 0.25) * 4.5;
  bL.position.z = Math.sin(t * 0.18) * 5 + 5;

  mL.position.x = Math.cos(t * 0.36 + Math.PI) * 9;
  mL.position.y = Math.sin(t * 0.25 + Math.PI) * 4.5;
  mL.position.z = Math.cos(t * 0.18) * 5 + 5;

  cL.position.x = Math.sin(t * 0.2) * 5;
  cL.position.z = Math.cos(t * 0.15) * 7 - 3;

  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
