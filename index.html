<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jaacck.me</title>
<meta name="description" content="personal website of mine">
<meta name="theme-color" content="#FF00C3">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --pink:#FF00C3;
    --ink:#000;
    --display:"Anton","Haettenschweiler","Arial Narrow",Impact,sans-serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html{background:var(--pink);-webkit-text-size-adjust:100%}

  body{
    min-height:100svh;
    background:var(--pink);
    color:var(--ink);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,6vw,64px);
    padding-bottom:calc(clamp(24px,6vw,64px) + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }

  .hero{
    text-align:center;
    max-width:1280px;
    width:100%;
    animation:rise .7s cubic-bezier(.16,1,.3,1) both;
  }

  .wordmark{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(64px,28vw,104px);
    line-height:.86;
    letter-spacing:-.015em;
    text-transform:lowercase;
  }

  .tagline{
    margin-top:clamp(20px,3vw,40px);
    font-size:clamp(14px,1.6vw,20px);
    font-weight:400;
    letter-spacing:-.005em;
  }

  .actions{
    margin-top:clamp(28px,4vw,52px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:34px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:var(--body);
    font-size:15px;
    font-weight:500;
    line-height:1;
    letter-spacing:-.005em;
    padding:15px 22px;
    min-width:58px;
    border:1.5px solid var(--ink);
    border-radius:6px;
    text-decoration:none;
    cursor:pointer;
    transition:background-color .18s ease,color .18s ease;
  }

  .btn--solid{background:var(--ink);color:#fff}
  .btn--outline{background:transparent;color:var(--ink)}

  .btn--solid:hover,.btn--solid:focus-visible{background:transparent;color:var(--ink)}
  .btn--outline:hover,.btn--outline:focus-visible{background:var(--ink);color:#fff}

  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  /* mobile: wordmark breaks after "jaacck", buttons stack full width */
  @media (max-width:520px){
    .actions{
      flex-direction:column;
      gap:10px;
      margin-inline:auto;
      max-width:320px;
    }
    .btn{width:100%;padding:14px 18px}
  }

  @media (prefers-reduced-motion:reduce){
    .hero{animation:none}
    .btn{transition:none}
  }

  .contact{
    position:fixed;
    right:clamp(16px,4vw,32px);
    bottom:calc(clamp(16px,4vw,32px) + env(safe-area-inset-bottom));
    font-family:var(--body);
    font-size:13px;
    font-weight:500;
    letter-spacing:-.005em;
    color:var(--ink);
    text-decoration:none;
    opacity:.6;
    transition:opacity .18s ease;
  }
  .contact:hover,.contact:focus-visible{opacity:1}

  @media (max-width:520px){
    .contact{right:50%;transform:translateX(50%);bottom:calc(14px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

  <main class="hero">
    <h1 class="wordmark">jaacck<wbr>.me</h1>
    <p class="tagline">personal website of mine</p>

    <nav class="actions" aria-label="Primary">
      <a class="btn btn--solid" href="https://lab.jaacck.me">lab</a>
    </nav>
  </main>

  <a class="contact" href="mailto:hello@jaacck.me">hello@jaacck.me</a>

</body>
</html>
