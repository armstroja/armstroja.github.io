<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jaacck.me</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    /* ── LOADER ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #loader img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── MAIN CONTENT (hidden until loader finishes) ── */
    #main {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #main.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loader">
    <img id="load-gif" src="load.gif" alt="Loading animation" />
  </div>

  <!-- YOUR SITE CONTENT GOES HERE -->
  <div id="main">
    <!-- content will be added later -->
  </div>

  <script>
    const loader = document.getElementById('loader');
    const main   = document.getElementById('main');
    const gif = document.getElementById('load-gif');
    const REVEAL_DELAY_MS = 2500;
    const ERROR_FALLBACK_DELAY_MS = 1000;
    const MAX_LOADER_TIMEOUT_MS = 10000;
    let revealed = false;

    function revealSite() {
      if (revealed) return;
      revealed = true;
      loader.classList.add('hidden');
      main.classList.add('visible');
      document.body.style.overflow = '';
    }

    function revealAfterGifLoad() {
      setTimeout(revealSite, REVEAL_DELAY_MS);
    }

    // Reveal shortly after GIF loads
    gif.addEventListener('load', revealAfterGifLoad);
    if (gif.complete) {
      revealAfterGifLoad();
    }

    // Fallback: if GIF fails to load, reveal after 1s
    gif.addEventListener('error', () => setTimeout(revealSite, ERROR_FALLBACK_DELAY_MS));
    setTimeout(revealSite, MAX_LOADER_TIMEOUT_MS); // hard cap at 10s
  </script>

</body>
</html>
