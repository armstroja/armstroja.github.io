<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jaacck.me</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    /* ── LOADER ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #loader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── MAIN CONTENT (hidden until loader finishes) ── */
    #main {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #main.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loader">
    <video id="load-video" src="load.mp4" autoplay muted playsinline></video>
  </div>

  <!-- YOUR SITE CONTENT GOES HERE -->
  <div id="main">
    <!-- content will be added later -->
  </div>

  <script>
    const loader = document.getElementById('loader');
    const main   = document.getElementById('main');
    const video  = document.getElementById('load-video');

    function revealSite() {
      loader.classList.add('hidden');
      main.classList.add('visible');
      document.body.style.overflow = '';
    }

    // Hide loader when video ends
    video.addEventListener('ended', revealSite);

    // Fallback: if video fails to load/play, reveal after 3s
    video.addEventListener('error', () => setTimeout(revealSite, 3000));
    setTimeout(revealSite, 10000); // hard cap at 10s
  </script>

</body>
</html>
