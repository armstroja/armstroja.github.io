<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jaacck.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  .wrap { position: relative; width: 100vw; height: 100vh; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 12vw, 10rem);
    letter-spacing: 0.02em;
    text-align: center;
    white-space: nowrap;

    color: transparent;
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.95),
      rgba(255, 255, 255, 0.55) 45%,
      rgba(255, 255, 255, 0.9) 100%
    );
    -webkit-background-clip: text;
    background-clip: text;

    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
  }

  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    opacity: 1;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #loader.hidden { opacity: 0; }

  .bar-track {
    width: min(240px, 60vw);
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.15);
    overflow: hidden;
  }
  .bar-fill {
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.85);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  #mix-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    padding: 1.1rem 0 1.4rem;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    transform: translateY(100%);
    transition: transform 0.35s ease;
  }
  #mix-sheet.show { transform: translateY(0); }

  #mix-sheet a {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
  <div id="loader"><div class="bar-track"><div class="bar-fill"></div></div></div>
  <div class="wrap">
    <video id="v" src="15883588-hd_1280_720_30fps.mp4" autoplay muted loop playsinline preload="auto"></video>
    <h1>jaacck.me</h1>
  </div>
  <div id="mix-sheet"><a href="https://mix.jaacck.me">mix</a></div>
  <script>
    const v = document.getElementById('v');
    const loader = document.getElementById('loader');
    const tryPlay = () => v.play().catch(err => console.log('autoplay blocked:', err));

    const showLoader = () => loader.classList.remove('hidden');
    const hideLoader = () => loader.classList.add('hidden');

    v.addEventListener('loadedmetadata', tryPlay);
    window.addEventListener('load', tryPlay);

    // stalls / rebuffering
    v.addEventListener('waiting', showLoader);
    v.addEventListener('stalled', showLoader);

    // recovered / actually playing
    v.addEventListener('playing', hideLoader);
    v.addEventListener('canplaythrough', hideLoader);

    // scroll/swipe down reveals the mix.jaacck.me sheet, scroll/swipe up hides it
    const sheet = document.getElementById('mix-sheet');
    let touchStartY = null;

    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 40) sheet.classList.add('show');
      else if (e.deltaY < -40) sheet.classList.remove('show');
    }, { passive: true });

    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (touchStartY === null) return;
      const delta = touchStartY - e.touches[0].clientY;
      if (delta > 40) sheet.classList.add('show');
      else if (delta < -40) sheet.classList.remove('show');
    }, { passive: true });
  </script>
</body>
</html>
